blocks:
  - type: header
    title: "\U0001F389<br>Community Day"
    description: >
      Después de la intensidad del viernes, el **sábado 24 de octubre —de 11:00h
      a 17:00h—** celebramos el «Día de la Comunidad», una jornada diseñada para
      que disfrutar relajadamente a la que podrás **traer a tu familia, amigos y
      compañeros de trabajo** para disfrutar de todas las actividades que hemos
      preparado y que disfrutarán por igual grandes y pequeños.<br><br>

      En esta página tienes una lista de todas las actividades, pero también
      puedes consultar [la agenda detallada](/#agenda) o ver [un video-resumen
      de la edición de 2022](https://vimeo.com/836780949){target="_blank"}, para
      que sepas que puedes esperar.
  - type: activities
    theme: is-primary width-box box-fill
    items:
      - title: <b>La DesconferencIA</b>
        tags:
          - Adultos
        img: /files/activities/tarugoff.jpeg
        description: >-
          Este año, transformamos nuestro tradicional *open space* en  <b>una
          pequeña miniconferencia paralela donde poder hablar tanto      de las
          oportunidades como de las incertidumbres       que ha introducido la
          IA en nuestro día a día</b>,       en un ambiente relajado y
          amigable,        donde TODOS tendremos la oportunidad de escuchar y
          ser escuchados.     </br></br>      Los asistentes podréis compartir y
          acceder a ese **«conocimiento tribal»       sobre trabajo con la IA**
          (desde el *tooling* que usáis a vuestros flujos de trabajo)  que NO
          suele estar publicado en ningún sitio y solo se transmite «boca a
          boca», pero TAMBIEN vuestras inquietudes respecto a cómo va a cambiar
          esto vuestro trabajo...  o vuestro miedo a que os pueda llevar a
          perderlo. Ningún tema sobra. </br></br> Dirigido por <a
          href="https://x.com/merybere" target="_blank">@merybere</a>  —con
          amplia experiencia dinamizando conferencias <i>ágiles</i>—  y dos
          TITANES del ecosistema IA, como son  <a href="https://x.com/dobleio"
          target="_blank">@dobleio</a> y <a href="https://x.com/root_rat"
          target="_blank">@root_rat</a>.
        wide: true
        style: is-shadow
      - title: "<b>Torneo de W1ndj4mm3rs</b> \U0001F3C6"
        tags:
          - Jóvenes
          - Mayores
        img: /files/activities/captura-de-pantalla-2026-07-01-a-las-8.14.54.png
        description: >-
          El año pasado llevamos a la vida real [el clásico videojuego de
          1994](https://www.youtube.com/watch?v=vOynFbfOejo){target=_blank} y el
          resultado fue... ESPECTACULAR, así que, este año
          repetiremos.</br></br>El sábado celebraremos un torneo con premios,
          muchas sorpresas y <a
          href="https://x.com/david_bonilla/status/2075105670890676699"
          target="_blank">nuestros awesómicos speakers</a>. Anímate a participar
          o disfruta del espectáculo como espectador.
        wide: false
      - title: <b>Taller de Yoyó</b>
        tags:
          - Jovenes
          - Adultos
        img: /files/activities/yoyob.webp
        description: >-
          Aprende a hacer algunos de los trucos más espectaculares del mundo del
          yoyó, como «el dormilón» o el <i>off-string</i>, en una master class
          sobre uno de los juguetes más antiguos del mundo.
        wide: false
      - title: <b>Realidad Virtual en Grupo</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/vr_grupo.jpg
        description: >-
          De la mano de <a href="https://vrinka.com/"
          target="_blank">VRINKA</a>, podrás experimentar la realidad virtual
          con tus amigos o tu familia, en un juego colaborativo que os llevará a
          luchar con Terminators dirigidos por una IA rebelde.
        wide: false
      - title: '<b>Debriefing de la #TRG26</b>'
        tags:
          - Mayores
        img: /files/activities/tar_debriefing.jpg
        description: >-
          Conoce y comenta todos los detalles del evento, charlando
          relajadamente con sus principales protagonistas —ponentes,
          patrocinadores y organizadores— en un ambiente relajado y amigable.
        wide: false
      - title: <b>Rincón Arcade</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/1761647849202.jpeg
        description: >-
          Tendremos nuestra pequeña versión del clásico salón de máquinas
          recreativas.</br></br>Disfruta, SIN TENER QUE ECHAR 25 PESETAS, de
          alguno de los mejores videojuegos de la historia en encarnizados
          campeonatos improvisados con tus amigos, familia u otros asistentes.
        wide: false
      - title: <b>Exhibición de Magia</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/tar_magia.jpg
        description: >-
          El mítico [Juan
          Tomas](https://twitter.com/juantomas){target="_blank"}, uno de los
          pocos magos grises aun en activo que conoció las tarjetas perforadas,
          nos obsequiará con unos trucos de ***mágia informática*** que
          disfrutarán grandes y pequeños.
        wide: false
      - title: <b>Scalextric Gigante</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/scalextric.jpeg
        description: >-
          Compite en el circuito que siempre soñaste montar en tu salón: más de
          12 metros de pista con 4 carriles.</br></br>¡Participa en trepidantes
          carreras con tus amigos u otros asistentes!
        wide: false
      - title: <b>Ludoteca</b>
        tags:
          - Niños
        img: /files/activities/tar_ludoteca.jpg
        description: >-
          Zona para que los niños de 3 a 6 años puedan jugar, vigilados por
          monitores titulados.</br></br>El único riesgo del que deben
          preocuparse los padres es que los críos no quieran marcharse.
        wide: false
      - title: <b>Taller de dibujo para pequeños grandes artistas</b>
        tags:
          - Jóvenes
          - Mayores
        img: /files/activities/hugo.jpg
        description: >-
          Aprende técnicas básicas de dibujo, que te harán parecer un experto,
          de la mano de [Hugo
          Tobio](https://twitter.com/HugoTobio){target=_blank} <b>¡El mismísimo
          ilustrador de La Bonilista!</b>
        wide: false
      - title: <b>Taller de Ajedrez (de 7 a 99 años)</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/talleres-ajedrez_1.max-1200x900.jpg
        description: >-
          Pequeños y mayores aprenderán las reglas básicas del ajedrez, para
          aprender divirtiéndose y adquirir una base que permita seguir
          descubriendo este apasionante juego.
        wide: false
      - title: <b>Juegos «Desenchufados»</b>
        tags:
          - Niños
          - Jóvenes
        img: /files/activities/TRG23_desenchufados.jpeg
        description: >-
          Juegos tradicionales para que las nuevas generaciones conozcan la vida
          que hay más allá de la consola.</br></br>¿Jugamos a las chapas?
        wide: false
      - title: <b>Conos de Luz</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/conos.png
        description: >-
          Diviértete y haz ejercicio con nuestros juegos de conos para toda la
          familia.
        wide: false
      - title: <b>Twister Gigante</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/tar_twister.jpg
        description: >-
          Podrás espanzurrarte con tus colegas y seres queridos. El único juego
          donde esperamos que realmente seas retorcido.
        wide: false
      - title: <b>Jenga Gigante</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/TRG23_jenga.jpeg
        description: >-
          El juego de toda la vida, pero más divertido —y grande— que
          nunca.</br></br>MUY grande.
        wide: false
      - title: <b>Laboratorio de personalización de chapas</b>
        tags:
          - Niños
          - Jóvenes
        img: /files/activities/TRG23_chapas.jpg
        description: >-
          ¡Fabrica chapas con tus propios diseños!<br><br>Puedes traer una foto,
          un diseño impreso... o hacer un dibujo allí mismo :)
        wide: false
      - title: <b>Pintacaras</b>
        tags:
          - Niños
        img: /files/activities/TRG23_pintacaras.jpeg
        description: >-
          Un clásico que nunca falla entre los más pequeños... y entre los no
          tan pequeños.
        wide: false
      - title: "\U0001F69A <b>Food Trailer</b>"
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/trailer.jpeg
        description: >-
          Vuelve el famoso **trailer de 12 ejes** que nos traemos desde Galicia
          para proporcionar opciones gastronómicas ricas, saludables y
          sostenibles para todos los asistentes al Community Day.
        wide: false
      - title: <b>Tienda</b>
        tags:
          - Niños
          - Jóvenes
          - Mayores
        img: /files/activities/tienda24.jpeg
        description: >-
          Tienda atendida por el equipo de la TRG donde podrás completar tu
          colección de merchandising del evento con piezas de esta o pasadas
          ediciones.</br></br>Podrás encontrar auténticas joyas *vintage* y
          suculentos descuentos.
        wide: false
  - type: faq
    title: FAQ
    id: faq
    theme: is-primary width-full box-fill
    questions:
      - question: ¿Quién puede ir al Community Day?
        answer: >-
          Pueden ir todos los asistentes con entrada de la TRGx que, además,
          pueden traer consigo a los acompañantes que quieran: amigos,
          familiares, compañeros de trabajo...<br><br>No podrán acceder personas
          *random* que no acompañen a un asistente de la TRG.
      - question: ¿Es una jornada solo para familias con niños?
        answer: >-
          ¡NORL! Hay actividades para grandes y pequeños, pero si quieres
          pasarte con tus hijos, padres o amigos para acercarles un poco más a
          la realidad de tu profesión, se lo pasarán PIRATA :)
      - question: ¿Cuesta algo?
        answer: >-
          No. El Community Day es **completamente gratuito**.</br></br>Solo
          tendréis que pagar los servicios de restauración (comida y bebida) que
          consumáis.
      - question: ¿Dónde se celebra?
        answer: >-
          En [La
          Nave](https://www.lanavemadrid.com/quienes-somos/){target=_blank}, en
          la calle Cifuentes 5 de Madrid, igual que el resto de la
          TRGx.</br></br>

          Si vais en **metro**, está a 5 minutos andando de la parada Villaverde
          Bajo - Cruce de la Línea 3.</br>

          Si llegáis en **tren**, lo tenéis a 7 minutos andando de la estación
          Puente Alcocer, en la Línea C5.
      - question: ¿Qué horario tiene? ¿Cuándo pasa cada cosa?
        answer: >-
          El Community Day arrancará a las 11:00h de la mañana y estará abierto
          hasta después de comer (a las 17:00h, tiene que estar todo
          recogido).</br></br>

          Como habrá muchas actividades en paralelo, hemos recopilado **todos
          los horarios y detalles** en [la Agenda del Evento](/#agenda).
      - question: ¿Habrá sitio para aparcar?
        answer: >-
          Sí claro. Al lado de La Nave hay MUCHO sitio para aparcar y un sábado
          aun más.
      - question: ¿Habrá comida y bebida?
        answer: >-
          Sí. El catering oficial del evento, [O Fogar do
          Santiso](https://fogardosantiso.es/){target=_blanck}, os ofrecerá
          distintas propuestas (de pago) para beber y comer durante toda la
          jornada.
      - question: ¿Hay un límite de aforo?
        answer: >-
          Sí, 1.000 personas. Pero si llegamos a ese límite, el próximo año
          alquilamos un estadio de fútbol.
      - question: ¡Tengo más dudas!
        answer: >-
          No pasa nada. Como siempre, escribe a
          [tarugoconf@bonillaware.com](mailto:tarugoconf@bonillaware.com) y allí
          estaremos encantados de atenderte.
