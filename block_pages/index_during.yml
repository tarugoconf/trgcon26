              ____


              Este año, enfocamos nuestro tradicional *open space* para
              convertirlo en <b>un espacio donde poder hablar tanto de las
              oportunidades como de las incertidumbres que ha introducido la IA
              en nuestro día a día</b>,       en un ambiente relajado y
              amigable,        donde TOD@S tendremos la oportunidad de escuchar
              y ser escuchados.     </br></br>      Las personas que asistáis
              podréis compartir y acceder a ese **«conocimiento tribal»      
              sobre trabajo con la IA** (desde el *tooling* que usáis a vuestros
              flujos de trabajo)  que NO suele estar publicado en ningún sitio y
