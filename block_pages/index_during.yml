  - type: separator
    width: is-default
  - type: speakers
    title: Speakers
    description: >
      El «speaker» o ponente de la Tarugoconf no nace, **[SE
      HACE](https://github.com/tarugoconf/trgcon26/blob/main/SPEAKERS.md){target=_blank}**.
      Estos

      son los awesómicos invitados con los que contaremos este año:
    id: speakers
    theme: width-full
    speakers:
      - name: José Ramón Pérez
        id: joseramon
        role: CPO/CTO
        bio: >-
          Jose Ramón ha sido CPO y CTO de Mercadona Tech, donde lideró la
          estrategia de producto e ingeniería de toda la vertical online de
          Mercadona.


          Antes, trabajó en roles de producto y tecnología en empresas como
          Amazon, JobandTalent o Tuenti.


          Es Doctor en Ciencias de la Computación por la Universidad Complutense
          de Madrid, en la especialidad de Ingeniería del Software e
          Inteligencia Artificial. Comparte lo que aprende en
          [Gemba](https://www.gemba.es/){target=_blank}, su newsletter semanal
          sobre producto, ingeniería y liderazgo técnico.
        image: /files/people/joseramon.jpg
        links:
          - icon: linkedin-logo
            url: 'https://www.linkedin.com/in/joseaguera/'
          - icon: spotify-logo
            url: 'https://open.spotify.com/show/2zTAR5x2wWtvdB8JXjy0cm'
          - icon: globe
            url: 'https://www.gemba.es/'
      - name: ' Mai Giménez'
        id: mai
        company: DeepMind
        role: 'Research Engineer '
        bio: >-
          Mai Giménez investiga en el desarrollo de modelos de lenguaje grandes
          y multimodales en Google DeepMind. Tiene un doctorado en comprensión
          del lenguaje natural y también completó un máster en diseño e
          ilustración.


          A Mai le apasiona crear la tecnología más útil para todo el mundo y su
          principal interés de investigación se centra en el lenguaje y los
          impactos sociotécnicos de estos modelos en el mundo real.


          Y, por si fuera poco, contribuye de forma activa a la comunidad
          técnica. Mai fue miembro de la junta directiva de la Asociación Python
          España, ayudó a organizar varias PyConES y es una orgullosa integrante
          de PyLadies.
        image: /files/people/mai_gimenez.jpg
        links:
          - icon: linkedin-logo
            url: 'https://www.linkedin.com/in/maigimenez/'
          - icon: x-logo
            url: 'https://x.com/maidotgimenez'
      - name: Cristian Córdova
        id: cristian
        company: Helmcode
        role: Fundador
        bio: >-
          Cristian es un camarada del metal, formado no en los pasillos de
          Stanford sino en la FP superior de Administración de Sistemas del
          Instituto Virgen de la Paz de Alcobendas.


          Culo inquieto, ha hecho todas las *pokevoluciones* del cacharreo,
          pasado de la simple gestión de una instancia Linux al SRE y después a
          DevOps, lo que le permitió adquirir todos los conocimientos necesarios
          para especializarse en la administración de infraestructura para IA.


          Fundador de Helmcode, una empresa que proporciona servicios de DevOps
          e Inferencia, tanto a empresas como a particulares.
        image: /files/people/cristian.jpg
        links:
          - icon: x-logo
            url: 'https://x.com/barckcode'
          - icon: globe
            url: 'https://helmcode.com/'
          - icon: linkedin-logo
            url: 'https://www.linkedin.com/in/helmcode/'
      - name: Andrés Torrubia
        id: andres
        company: Nanomind
        role: CEO
        bio: >-
          Andrés vendió su empresa por $34M cuando en España aun no se hablaba
          de startups y **ya intentó que comprendieramos el *tsunami* que sería
          la IA cuando nadie hablaba de IA**. Ni más ni menos que [en la TRG de
          2018](https://vimeo.com/305100749){target="_blank"}, CUATRO AÑOS ANTES
          de que se lanzara la primera versión de ChatGPT.


          En 2026 vuelve a la TRG con la esperanza de que, esta vez, prestemos
          más atención a su particular visión sobre la *odisea* que van a tener
          que recorrer los programadores si quieren seguir ejerciendo su
          profesión.


          Actualmente, Andrés trabaja como CEO de Nanomind —la empresa que fundó
          junto a su mujer, Aurelia Bustos— donde se dedican a buscar nuevos
          medicamentos para curar enfermedades como el Alzheimer, con la ayuda
          de la IA.
        image: /files/people/andres_torrubia.jpg
        links:
          - icon: linkedin-logo
            url: 'https://www.linkedin.com/in/andrestorrubia/'
          - icon: x-logo
            url: 'https://x.com/antor'
      - name: Nuria Mediavilla
        id: nuria
        company: Tinybird
        role: Product Designer
        bio: >-
          Nuria diseña para desarrolladores, o sea, se dedica a convencer a
          gente muy lista de que el diseño no es decoración, es lógica, solo que
          con otro lenguaje. Es de Bilbao, tiene la mala hostia que se le
          presupone a cualquier bilbaína, y la lleva usando a su favor desde que
          se metió en esto.


          Lleva cuatro años en Tinybird, después de pasar por Corunet,
          Zorraquino y una temporada de freelance. Ahora usa Claude Code para
          tener autonomía real: lleva sus propios cambios a producción y le
          quita carga a ingeniería en todo lo que puede resolver ella misma. Va
          de que el diseño deje de ser el cuello de botella.


          Fuera del trabajo, Blur —su mejor amigo, un galgo de 12 años— la sigue
          a todas partes. Le apasiona el diseño y le apasiona la IA, pero donde
          de verdad disfruta es comiendo bien, de fiesta y viajando. Vamos, una
          disfrutona.
        image: /files/people/nuria2.jpg
        links:
          - icon: linkedin-logo
            url: 'https://es.linkedin.com/in/nuriamediavilla'
          - icon: x-logo
            url: 'https://x.com/nmediavilla19'
      - name: Ari Font
        id: ari
        company: Alinia AI
        role: Cofundadora y CEO
        bio: >-
          Ariadna (o Ari) lleva años intentando que las máquinas entiendan a los
          humanos… y que los humanos se hagan responsables de sus máquinas.


          Licenciada en Traducción e Interpretación por la Universitat Pompeu
          Fabra y doctora por Carnegie Mellon, ha desarrollado su carrera entre
          el lenguaje, la inteligencia artificial y los problemas que aparecen
          cuando ambas cosas llegan al mundo real.


          Fue directora de desarrollo en IBM Watson y lideró la plataforma de
          machine learning de Twitter, donde impulsó el programa de IA
          responsable.


          Hoy es cofundadora y CEO de Alinia AI, donde trabaja para que las
          empresas puedan desplegar agentes de IA con controles, supervisión y
          trazabilidad.
        image: /files/people/ari-font-2.jpg
        links:
          - icon: linkedin-logo
            url: 'https://www.linkedin.com/in/ariadna/'
          - icon: globe
            url: 'https://www.alinia.ai/'
          - icon: x-logo
            url: 'https://x.com/quicola'
      - name: Juanjo Montiel
        id: juanjo
        company: Microsoft
        role: Senior Software Development Engineer
        bio: >-
          Juanjo Montiel es ingeniero de software en Microsoft, especializado en
          .NET, C#, servicios en la nube y accesibilidad digital. Ciego de
          nacimiento y programador autodidacta desde la adolescencia, lleva más
          de diecinueve años creando productos y experiencias digitales
          accesibles.


          A lo largo de su trayectoria ha combinado el desarrollo profesional
          con la docencia, la divulgación y la creación de proyectos propios.
          Entre ellos se encuentran TagFit, una aplicación para identificar y
          organizar ropa de forma accesible, y Corro, un motor de juegos de mesa
          y cartas diseñado para que personas ciegas y videntes puedan jugar
          juntas en igualdad de condiciones.


          Le apasiona construir software de calidad, explorar cómo la tecnología
          puede ampliar la autonomía de las personas y compartir lo que aprende
          mediante cursos, artículos y conferencias, siempre desde la cercanía y
          el buen humor.
        image: /files/people/juanjo.jpg
        links:
          - icon: linkedin-logo
            url: 'https://www.linkedin.com/in/jjmontiel/'
          - icon: globe
            url: 'https://www.kastwey.org/'
          - icon: butterfly
            url: 'https://bsky.app/profile/kastwey.org'
          - icon: mastodon-logo
            url: 'https://bookstodon.es/@kastwey'
