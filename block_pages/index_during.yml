blocks:
  - type: hero
    title: TRG26
    intro: >-
      <video class="video-bg" preload playsinline autoplay muted loop
      src="/files/hero-loop.mp4"></video>

      <div class="logo">

      <time>Madrid. 22–24 octubre</time>

      <img src="/files/trgcon-2-veintiseis.png" alt="TRGCON Veintiseis">

      </div>

      <img src="/files/forma-1.png" alt="" class="forma-1">

      <img src="/files/forma-2.png" alt="" class="forma-2">
  - type: text
    id: intro
    theme: width-full
    columns: false
    text: >-
      La IA ha supuesto una revolución para la sociedad en general y el sector
      tecnológico en particular. En 2026, la TRG quiere ser el lugar donde
      separar la señal del ruido y aprender lo que realmente debemos hacer para
      seguir construyendo el futuro.
  - type: calendar
    title: Agenda
    description: >-
      Tres días llenos de actividades, pero sobre todo, de oportunidades para
      conocer y ser conocido.
    id: agenda
    theme: is-light width-box box-fill
    days:
      - title: 'Jueves, 22 de octubre'
        events:
          - time: '15:00h'
            title: Apertura de puertas y acreditación de asistentes
            id: apertura-jueves
            description: >
              ¡Acredítate antes que nadie y evita las colas del viernes! Trae tu
              entrada, impresa o en el móvil, y **recoge tu awesómico welcome
              pack** antes de disfrutar de todas las actividades y contenido de
              la TRG26 ¡Bienvenidos!
            speakers: []
          - time: '15:30 - 19:00h'
            title: TALLERES PRÁCTICOS
            id: taller-sponsors
            subtitle: ¡Reserva tu plaza!
            description: "Talleres patrocinados por nuestros sponsors, que abren a los asistentes de la TRG26.\n\nPodéis reservar vuestra plaza al comprar la entrada de la TRG, pero **si se os olvidó, también podéis reservar AHORA** [en Eventbrite](https://www.eventbrite.es/e/entradas-trg26-1985907372410){target=_blank} —eso sí— usando el mismo mail con el que os registrastéis \U0001F64F\n\n* 15:30 - 18:00h Webs escalables y mantenibles en la era de la IA (ofrecido por WordPress)\n* <s>15:30 - 18:00h Ata en corto a tus agentes: SDD en directo (ofrecido por Onext)</s> AGOTADO\n* <s>15:30 - 18:00h De Developer a Forward Deployed Engineer (ofrecido por Orbitant)</s> AGOTADO\n* 17:30 - 19:00h Escenarios legales clave que la IA no solucionará (ofecido por Rama Legal)"
            speakers: []
          - time: '18:00 - 20:00h'
            title: Networking Tarugo
            id: networking-jueves
            subtitle: "Conoce a gente nueva \U0001F60A"
            description: >-
              Actividades opcionales y dinámicas divertidas, para que los
              asistentes se conozcan entre sí en un ambiente distendido y
              seguro, lideradas por voluntarios de la TRG.


              Si no conoces a nadie, saldrás con un grupo con el que compartir
              el resto de la conferencia y, si vienes acompañado, ampliarás el
              circulo con el que interactuarás durante el resto del evento.
            speakers: []
          - time: '20:00 - 22:00h'
            title: Corrupción en m-IA-mi
            id: show-jueves
            subtitle: "con Monos Estocásticos \U0001F435\U0001F648"
            description: "[Antonio](https://x.com/antonello){target=\"_blank\"} y [Mati](https://x.com/matiass){target=\"_blank\"} son el ying y el yang de [Monos Estocásticos](https://cuonda.com/monos-estocasticos){target=\"_blank\"} **uno de los podcast más didácticos, rigurosos y —sobre todo— divertidos sobre  Inteligencia Artificial** que puedes escuchar en castellano.\n\nEn la TRG26 grabarán un programa en directo en el que interactuarán constantemente con el público \U0001F973\n\nLa IA ha puesto patas arriba la industría tecnológica, pero ¿cuánto hay de realidad y cuánto de pensamiento mágico detrás de las últimas decisiones empresariales y las oleadas de despidos?\n\nEn dos horas, nuestros monos separán la señal del ruido para **dibujar un mapa que nos indique hacia dónde va el sector informático y qué debemos hacer para no perdernos por el camino**.\n___\n \n### ONE MORE THING... «RUINA SE ESCRIBE CON I y A»\n\nAl estilo del popular formato [La Ruina](https://www.youtube.com/watch?v=Ee1zWoCk6ZI&t=752s){target=\"_blank\"}, los asistentes al *chou* podrán compartir sus particulares «ruinas» informáticas —con cualquier tecnología en general y con la IA en particular— en una divertida catarsis colectiva que nos elevará a un nivel superior de consciencia.\n\n¿De verdad te lo vas a perder?"
            speakers: []
      - title: 'Viernes, 23 de octubre'
        events:
          - time: '9:00h'
            title: Apertura de puerta y acreditación de asistentes
            id: apertura-viernes
            description: >-
              ¡Acredítate antes que nadie y evita las colas! Trae tu entrada,
              impresa o en el móvil, y disfruta de todas las actividades y
              contenido de la TRG26.


              Te recibiremos con **café, bica gallega y fruta**... además de
              amenizar la espera con la música de [Don
              Robot](https://www.youtube.com/watch?v=ltXX9Ab6vuo){target="_blank"},
              nuestro DJ residente, que te transportará a Miami en cuanto cruces
              por la puerta.


              ¡Bienvenidos!
            speakers: []
          - time: '10:00 - 10:15h'
            title: El día del juicio final
            id: keynote
            subtitle: Keynote
            description: >-
              En la apertura de la TRG puede pasar cualquier cosa, desde que
              alguien salga vestido de comandante de la Fuerza Aerea Gallega
              hasta que aparezca Steve Jobs. Te podrá gustar más o menos, pero
              no te dejará indiferente.


              Lo único que te pedimos es que acudas con la mente abierta y que
              seas puntual. A las 10:00h cerraremos las puertas del auditorio,
              que quedaran selladas hasta las 10:15. Lo que pasa en la TRG se
              queda en la TRG...


              Además, en esta keynote te daremos toda la información para que
              puedas disfrutar al 100% del evento.
            speakers:
              - david-bonilla
          - time: '10:15 - 11:00h'
            title: La odisea del programador
            id: charla-andres
            subtitle: por Andrés Torrubia
            description: >-
              Debemos asumir que llevamos décadas perfeccionando habilidades que
              cada día parecen valer menos.


              Pueden aceptarlo o no, pero **para seguir trabajando como tal, los
              programadores deben embarcarse en un viaje** en el que
              experimentarán perdida, ira e incertidumbe.


              Una autentica *odisea* que Andrés ya ha sufrido y por la que nos
              intentará guiar, para que la travesía se haga más liviana y —sobre
              todo— consigamos llegar a nuestro destino.


              Sin urgencia y sin miedo, pero también sin mirar atrás.
            speakers:
              - andres
          - time: '11:00 - 11:45h'
            title: Quemar tokens sin quemar tu empresa
            id: charla-cristian
            subtitle: por Cristian Córdova
            description: >-
              Los modelos comerciales de IA son comodísimos. Hasta que dejan de
              serlo.


              Cuotas, costes impredecibles, límites de uso, privacidad,
              cumplimiento legal, latencia... o la necesidad de que nuestra
              plantilla y nuestras aplicaciones pueda usar IA sin mirar el
              contador de tokens cada cinco minutos. Tarde o temprano, muchas
              empresas se hacen la misma pregunta: **¿tiene sentido montar
              nuestra propia infraestructura de IA?**


              En esta charla, Cristian Córdova te explicará cuándo merece la
              pena desplegar y gestionar un LLM propio, qué tipo de empresas
              pueden beneficiarse más de ello y cuáles deberían pensárselo dos
              veces antes de comprar una GPU.


              Hablaremos de modelos abiertos, servidores de inferencia,
              hardware, costes reales, operación, seguridad, aspectos legales,
              convivencia con modelos comerciales y todas esas decisiones que no
              aparecen en los tutoriales, pero que determinarán si tu «ChatGPT
              privado» acaba siendo una ventaja competitiva… o una estufa
              carísima con API compatible con OpenAI.
            speakers:
              - cristian
          - time: '11:45 - 12:00h'
            title: ¡El Precio Justo!
            description: >-
              Un concursote de Lanzarote en el que los asistentes de la TRG
              podrán demostrar sus conocimientos sobre el *bisnes* de la
              Informática y ganar suculentos premios.
            speakers: []
          - time: '12:00 - 12:45h'
            title: ☕ Coffe Break
            description: >-
              Café, snacks y pastitas para llenar las tripitas.


              Este intermedio estará amenizado por el DJ residente de la TRG
              —[Don
              Robot](https://www.youtube.com/watch?v=ltXX9Ab6vuo){target="_blank"}—,
              que pinchará los mejores mixes del estilo Miami Bass.
            speakers: []
          - time: '12:00 - 12:15h'
            title: ¡El Precio Justo! (2ª parte)
            description: >-
              Después de *la publicidad*, volvemos con la segunda parte de
              nuestro concursote de Lanzarote en el que —para ganar— los
              asistentes de la TRG habrán tenido que averiguar la respuesta a
              una última pregunta durante la pausa del café!
            speakers: []
          - time: '13:00 - 13:45h'
            title: 'Matar al SaaS es fácil, lo difícil viene después'
            id: charla-joseramon
            subtitle: por Jose Ramón Pérez
            description: >-
              La IA ha acelerado un proceso de *deSaaSificación*, desdibujando
              la fina línea que separa la compra de software del desarrollo
              propio.


              Constantemente nos llegan cantos de sirena que afirman que **el
              SaaS ha muerto**. La realidad, como casi siempre, es bastante
              menos sexy, pero mucho más interesante.


              En esta charla, José Ramón nos contará qué ocurre el día después
              de sustituir una herramienta comercial —clave para el
              funcionamiento de una plataforma online que factura más de 1.000
              millones de euros— por una solución propia.


              Aprenderemos cómo decidir qué merece la pena internalizar, cómo
              calcular el coste real más allá del desarrollo inicial, cómo
              organizar el mantenimiento para evitar que la solución se quede
              atrás y cómo compararnos de forma honesta con las alternativas que
              ofrece el mercado.
            speakers:
              - joseramon
          - time: '13:45 - 14:30h'
            title: Cómo programan quienes programan la IA
            id: charla-mai
            subtitle: por Mai Giménez
            description: >-
              La inteligencia artificial ha cambiado para siempre la forma en la
              que desarrollamos software, pero demasiadas empresas todavía creen
              que «trabajar con IA» consiste en pagar una suscripción de Gemini,
              Claude o Codex a sus desarrolladores.


              Limitarse a replicar el día a día con la asistencia de un LLM es
              un grave error. En la era de la IA agéntica, el miedo a la página
              en blanco ha muerto, pero el peligro real es el *AI-slop*. Nuestro
              rol como desarrolladores debe evolucionar para adaptarse a este
              nuevo paradigma, repensando la organización, los flujos y las
              herramientas que esa nueva realidad exige.


              En esta charla, Mai diseccionará **las dinámicas de programación,
              procesos de revisión y mecanismos de colaboración en empresas que
              no solo usan IA, sino que la desarrollan**. Qué tareas se aceleran
              y escalan. Dónde sigue mereciendo la pena invertir tiempo humano.
              Qué cuellos de botella nuevos aparecen. Qué hábitos y buenas
              prácticas conviene cultivar para trabajar mejor sin delegar jamás
              la responsabilidad de pensar.


              **Para que, más allá del *hype* y el ruido, entendamos hacia dónde
              evolucionará de verdad el desarrollo de software** en los próximos
              años.
            speakers:
              - mai
          - time: '14:30 - 16:30h'
            title: "\U0001F419 Comida y Pulpeirada"
            id: comida-viernes
            description: >-
              Diferentes opciones gastronómicas ecológicas, sostenibles y mucho
              gallegas... incluyendo a Anxo —nuestro pulpeiro de O Carballiño—
              que distribuirá **300 raciones de pulpo *a feira* recien hecho**,
              y muchas mas cosas distribuidas por las mesas para que nadie tenga
              que esperar ninguna cola.


              Y, por supuesto, contaremos con opciones veganas y sin gluten.
            speakers: []
          - time: '16:30 - 16:45h'
            title: ¿Cuánto saben los muggles de IA?
            subtitle: Videoreportaje
            description: >-
              Nuestros intrépido reportero [Antonio
              Rodriguez](https://x.com/AntonioRoLo_){target="_blank"} se lanza a
              la calle, micrófono en mano, para averiguar hasta qué sabe el
              público general de la IA y su impacto.
            speakers: []
          - time: '16:45 - 17:30h'
            title: 'El Diseño post-chatGPT: eliminando barreras, no trabajos'
            id: charla-nuria
            subtitle: por Nuria Mediavilla
            description: >-
              ¿Qué pasa cuando ya no necesitas a nadie más para llevar una idea
              a producción? **¿Sigue haciendo falta un perfil de diseño cuando
              cualquiera puede generar una interfaz en segundos?** ¿O es
              precisamente ahora cuando ese perfil se vuelve más necesario que
              nunca?


              Nuria contará cómo ha pasado de proponer diseño a construirlo y
              lanzarlo ella misma, usando IA para eliminar las barreras técnicas
              que antes obligaban a depender de otros equipos: prototipos,
              cambios en producción, sistemas de interacción. No se trata de
              trabajar más rápido, sino de tener autonomía real sobre el impacto
              del propio trabajo, y de entender que el buen criterio de diseño
              importa más cuanto menos cuesta ejecutar cualquier cosa.


              Los asistentes a esta charla se llevarán **un enfoque práctico de
              cómo integrar diseño en el desarrollo iterativo de productos o
              servicios digitales en la era de la IA**, y por qué el perfil de
              diseño, lejos de sobrar, es hoy de los que más puede aportar.
            speakers:
              - nuria
          - time: '17:30 - 18:15h '
            title: 'Fue la IA, señoría (que no te pase a ti)'
            id: charla-ari
            subtitle: por Ari Font
            description: >-
              Un empleado pega un contrato confidencial en un chatbot. Un agente
              promete a un cliente algo que la empresa no puede cumplir. Un
              directivo utiliza un modelo para decidir a quién contratar... La
              IA puede multiplicar la productividad de nuestro equipo, pero
              también las posibilidades de liarla parda sin que ni siquiera nos
              demos cuenta.


              En esta charla, Ari nos explicará **los riesgos y
              responsabilidades legales que supone introducir IA en nuestra
              empresa**, tanto con modelos gestionados por nosotros mismos como
              con servicios de terceros. 


              Te llevarás un mapa para no perderte entre las preguntas,
              controles y evidencias que deberías revisar antes de poner una IA
              a trabajar en un proceso o aplicación.
            speakers:
              - ari
          - time: '18:15 - 19:00h'
            title: "\U0001F36A Merienda"
            id: merienda-viernes
            description: >-
              Café y bollería artesanal para aguantar hasta el final.


              En esta ocasión, **Don Robot** teñirá el ambiente con ritmos
              tropicales y latinos que nos harán mover los pies como
              langostinos.
            speakers: []
          - time: '19:00 - 19:15h'
            title: "\U0001F3B0 La Jerocleta"
            description: >-
              ¡El momento más esperado por los asistentes veteranos de la TRG!


              Sorteo de jugosos premios entre todos los que tuiteen con el
              *hashtag*
              [#TRG26](https://x.com/search?q=%23trg26&src=typed_query&f=live){target="_blank"},
              realizado con la mítica «Jerocleta» de **Jerónimo López**. Sin
              duda alguna, el software español más utilizado de la historía.


              ¡Cuanto más tuitees, más posibilidades tendrás de ganar!
            speakers: []
          - time: '19:15 - 20:00h'
            title: Lo veo todo negro (AI powered Edition™)
            id: charla-juanjo
            subtitle: por Juanjo Montiel
            description: "Juanjo lleva más de diecinueve años trabajando como desarrollador. Y, como casi todos los programadores, contempla la inteligencia artificial con una mezcla de fascinación y cierta inquietud.\n\nPero Juanjo puede aportar una perspectiva especialmente reveladora sobre esta tecnología porque es ciego de nacimiento. Aunque ninguno sabemos muy bien qué futuro nos deparará la IA, él si puede afirmar con absoluta seguridad que lo ve NEGRO \U0001F60E\n \nEn esta charla, Juanjo nos mostrará las posibilidades y retos que ha introducido la IA en nuestro día a día —productividad, autonomía, dependencia de plataformas de terceros, falsas promesas, sesgos, el derribo de antiguas barreras y la aparición de otras nuevas— pero desde un prisma que las aumenta por 1.000, como es depender de la tecnología no por comodidad, sino para percibir el mundo y tomar decisiones diarias.\n\nUn prisma que, precisamente por eso, pone esas posibilidades y esos retos a la vista de todos, ciegos o no."
            speakers:
              - juanjo
          - time: '20:00 - 20:15h'
            title: ¿Y el año que viene?
            id: trg27
            description: "Como ya es tradición, **con las cuentas del evento ya claras** —fuentes de ingresos, partidas de gastos y cuenta de resultados-, es el momento de volver la vista atrás, mirar hacia delante y... confirmar si habrá o no TRG el próximo año \U0001F631"
            speakers:
              - david-bonilla
          - time: '20:30 - 22:30h'
            title: "\U0001F973 Legendaria Fiesta Taruga"
            id: fiesta
            description: >-
              Transformaremos La Nave en una auténtica «discoteque» con comida y
              bebida, **suministro ilimitado de churros con y sin chocolate**,
              música y las mejores conversaciones del planeta porque... LA VIDA
              PUEDE SER MARAVILLOSA.


              * **INTRO** - Este año contaremos con la actuación de la
              **Ma-IA-mi Sound Machine**, una pareja de DJs que rendirá homenaje
              al sonido *house* de Miami con un set lleno de energía y buena
              música.

              * **MAIN EVENT** - El reggaetón más canalla nos hará bailar hasta
              bien entrada la noche.
            speakers: []
